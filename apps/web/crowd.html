<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crowd · simulated people</title>
    <style>
      :root {
        color-scheme: light;
        font: 13px/1.45 system-ui, sans-serif;
        color: #1f2430;
        background: #f6f7f9;
      }
      body {
        margin: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 14px;
        margin: 20px 0 8px;
      }
      small {
        color: #5b6270;
        font-weight: normal;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        padding: 6px 8px;
        border-bottom: 1px solid #e3e6eb;
        text-align: left;
        vertical-align: top;
      }
      th {
        font-weight: 600;
        background: #eef0f4;
      }
      .num {
        text-align: right;
        white-space: nowrap;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 50%;
      }
      .err {
        color: #9f1d1d;
      }
      .log {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .log li {
        padding: 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="crowd"></div>
    <script type="module" src="/src/crowd/main.ts"></script>
  </body>
</html>
